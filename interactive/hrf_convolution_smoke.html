<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Convolved block response, test page</title>
<style>
  /* Colours are copied from src/fnirs_tutorials/style.py (PALETTE and STYLE) so that
     the page matches the static figures. The canvas is light in both modes of the
     book, as the figures are, so the page does not follow the dark mode. */
  :root {
    --canvas: #ffffff;
    --text: #1f2328;          /* STYLE["text.color"] */
    --tick: #656d76;          /* STYLE["xtick.color"] */
    --axis: #d0d7de;          /* STYLE["axes.edgecolor"] */
    --grid: #d8dee4;          /* STYLE["grid.color"] */
    --boxcar: #3b82f6;        /* PALETTE[4] */
    --response: #059669;      /* PALETTE[3] */
    --convolution: #7c3aed;   /* PALETTE[0] */
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0;
    padding: 12px 16px 16px;
    background: var(--canvas);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .notice { margin: 0 0 12px; color: var(--tick); }
  .control { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 0 0 8px; }
  .control .control-text { font-weight: 600; min-width: 11em; }
  .control input[type="range"] { flex: 1 1 200px; min-width: 160px; height: 32px; accent-color: var(--convolution); }
  #plot { width: 100%; }
  #plot svg { display: block; width: 100%; height: auto; }
  svg text { font: 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); }
  svg .tick text { fill: var(--tick); }
  svg .axis-title { font-size: 12px; }
  svg .curve-label { font-weight: 600; }
  svg .axis path, svg .axis line { stroke: var(--axis); }
  svg .grid path { stroke: none; }
  svg .grid line { stroke: var(--grid); stroke-width: 0.5; }
  svg .curve { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .readout { margin: 6px 0 0; color: var(--tick); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<p class="notice">This is a test page for the embedding path. The chapter on the haemodynamic response rebuilds this illustration with its sources.</p>

<div class="control">
  <span class="control-text"><label for="block-length">Block length</label>: <output id="block-value" for="block-length" aria-live="off">10 s</output></span>
  <input id="block-length" type="range" min="1" max="40" step="0.5" value="10" aria-describedby="response-area readout">
</div>

<div id="plot" role="img" aria-label="Three stacked plots over time in seconds: a boxcar, a double-gamma response, and their convolution."></div>
<!-- Nothing on this page is a live region. A screen reader announces the slider's own
     value text once per step; the visible value and readout follow the slider but are
     not announced, and are read as the description of the slider when it takes focus. -->
<p id="response-area" class="readout"></p>
<p id="readout" class="readout"></p>

<script src="vendor/d3.min.js"></script>
<script>
"use strict";

/* ---- Constants ---------------------------------------------------------- */

// Placeholder values of the common canonical double-gamma shape (a positive lobe
// peaking near 6 s and an undershoot peaking near 16 s). They are to be sourced when
// the chapter is written. A gamma density of integer shape k and unit scale has its
// mode at k - 1 seconds. UNDERSHOOT_RATIO is the weight of the second density relative
// to the first, 1 to 6, not a ratio of heights: the first density peaks at 0.1606 and
// the second, once weighted, at 0.0165, so the lobes stand at about 9.7 to 1, and the
// undershoot of the curve, which is scaled to a peak of 1, reaches -0.091.
const PEAK_SHAPE = 7;
const UNDERSHOOT_SHAPE = 17;
const UNDERSHOOT_RATIO = 1 / 6;

const TIME_STEP_S = 0.1;      // grid step of the convolution
const TIME_END_S = 80;        // the plots run from 0 s to this time
const BLOCK_ONSET_S = 0;      // the boxcar starts here
const HRF_LENGTH_S = 40;      // the response is taken as zero after this time

const PANEL_HEIGHT = 104;
const PANEL_GAP = 22;
const MARGIN = { top: 8, right: 14, bottom: 46, left: 62 };
const X_TICK_STEP_S = 10;

/* ---- Mathematics -------------------------------------------------------- */

// Natural log of the gamma function for integer arguments: ln((k - 1)!).
function logFactorial(n) {
  let s = 0;
  for (let i = 2; i <= n; i += 1) s += Math.log(i);
  return s;
}

// Density of a gamma distribution of integer shape k and unit scale.
function gammaPdf(t, k) {
  if (t <= 0) return 0;
  return Math.exp((k - 1) * Math.log(t) - t - logFactorial(k - 1));
}

// Double-gamma response sampled on the grid, scaled so that its peak is 1.
function makeResponse() {
  const n = Math.round(HRF_LENGTH_S / TIME_STEP_S) + 1;
  const h = new Float64Array(n);
  let peak = 0;
  for (let i = 0; i < n; i += 1) {
    const t = i * TIME_STEP_S;
    h[i] = gammaPdf(t, PEAK_SHAPE) - UNDERSHOOT_RATIO * gammaPdf(t, UNDERSHOOT_SHAPE);
    peak = Math.max(peak, h[i]);
  }
  for (let i = 0; i < n; i += 1) h[i] /= peak;
  return h;
}

// Boxcar of height 1 from BLOCK_ONSET_S to BLOCK_ONSET_S + length.
function makeBoxcar(length) {
  const n = Math.round(TIME_END_S / TIME_STEP_S) + 1;
  const b = new Float64Array(n);
  for (let i = 0; i < n; i += 1) {
    const t = i * TIME_STEP_S;
    b[i] = t >= BLOCK_ONSET_S - 1e-9 && t < BLOCK_ONSET_S + length - 1e-9 ? 1 : 0;
  }
  return b;
}

// Discrete convolution y[i] = sum_j h[j] b[i - j] * dt, truncated to the plot window.
function convolve(b, h) {
  const y = new Float64Array(b.length);
  for (let i = 0; i < b.length; i += 1) {
    let s = 0;
    const jMax = Math.min(i, h.length - 1);
    for (let j = 0; j <= jMax; j += 1) s += h[j] * b[i - j];
    y[i] = s * TIME_STEP_S;
  }
  return y;
}

/* ---- Data ---------------------------------------------------------------- */

const response = makeResponse();
const responseArea = d3.sum(response) * TIME_STEP_S;
const responseOnPlot = Array.from({ length: Math.round(TIME_END_S / TIME_STEP_S) + 1 },
  (_, i) => (i < response.length ? response[i] : 0));
const X_TICKS = d3.range(0, TIME_END_S + 1, X_TICK_STEP_S);

// Tick text: an integer as it is, otherwise one decimal.
function formatTick(v) {
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

/* ---- Drawing ------------------------------------------------------------- */

const svg = d3.select("#plot").append("svg").attr("aria-hidden", "true");
const xTitle = svg.append("text").attr("class", "axis-title").attr("text-anchor", "middle").text("Time (s)");

function panelSpecs(length) {
  const boxcar = makeBoxcar(length);
  const conv = convolve(boxcar, response);
  const plateauAxisMax = Math.ceil(responseArea);   // fixed so that the slider visibly changes the curve
  // The convolution can dip below zero in its undershoot; keep the zero line visible.
  const convMin = Math.min(-0.5, Math.floor(d3.min(conv) * 2) / 2);
  return {
    conv,
    panels: [
      { key: "boxcar", values: boxcar, label: "Boxcar", domain: [0, 1.2], ticks: [0, 0.5, 1], title: "Stimulus (a.u.)" },
      { key: "response", values: responseOnPlot, label: "Haemodynamic response", domain: [-0.4, 1.2], ticks: [-0.4, 0, 0.5, 1], title: "Response (a.u.)" },
      { key: "convolution", values: conv, label: "Convolution", domain: [convMin, plateauAxisMax], ticks: d3.ticks(0, plateauAxisMax, 3), title: "Convolution (a.u. · s)" },
    ],
  };
}

function render(width, length) {
  const { conv, panels } = panelSpecs(length);
  const height = MARGIN.top + 3 * PANEL_HEIGHT + 2 * PANEL_GAP + MARGIN.bottom;
  const innerWidth = Math.max(120, width - MARGIN.left - MARGIN.right);
  const x = d3.scaleLinear([0, TIME_END_S], [MARGIN.left, MARGIN.left + innerWidth]);

  svg.attr("viewBox", `0 0 ${width} ${height}`).attr("width", width).attr("height", height);
  xTitle.attr("x", MARGIN.left + innerWidth / 2).attr("y", height - MARGIN.bottom + 38);

  svg.selectAll("g.panel")
    .data(panels, (d) => d.key)
    .join((enter) => enter.append("g").attr("class", "panel"))
    .attr("transform", (_, k) => `translate(0,${MARGIN.top + k * (PANEL_HEIGHT + PANEL_GAP)})`)
    .each(function (spec, k) {
      const panel = d3.select(this);
      const y = d3.scaleLinear(spec.domain, [PANEL_HEIGHT, 0]);
      const colour = `var(--${spec.key})`;
      const line = d3.line().x((_, i) => x(i * TIME_STEP_S)).y((v) => y(v));
      // One group per kind of layer, found again on each redraw by all of its classes
      // (a selector built from "axis y-axis" would match nothing and add a group each time).
      const layer = (cls) => panel.selectAll(`g.${cls.split(" ").join(".")}`).data([0]).join("g").attr("class", cls);

      layer("grid x-grid").attr("transform", `translate(0,${PANEL_HEIGHT})`)
        .call(d3.axisBottom(x).tickValues(X_TICKS).tickSize(-PANEL_HEIGHT).tickFormat(""));
      layer("grid y-grid").attr("transform", `translate(${MARGIN.left},0)`)
        .call(d3.axisLeft(y).tickValues(spec.ticks).tickSize(-innerWidth).tickFormat(""));
      layer("axis x-axis").attr("transform", `translate(0,${PANEL_HEIGHT})`)
        .call(d3.axisBottom(x).tickValues(X_TICKS).tickSize(4).tickSizeOuter(0)
          .tickFormat(k === panels.length - 1 ? formatTick : () => ""));
      layer("axis y-axis").attr("transform", `translate(${MARGIN.left},0)`)
        .call(d3.axisLeft(y).tickValues(spec.ticks).tickSize(4).tickSizeOuter(0).tickFormat(formatTick));

      panel.selectAll("text.axis-title").data([spec.title]).join("text")
        .attr("class", "axis-title").attr("text-anchor", "middle")
        .attr("transform", `translate(14,${PANEL_HEIGHT / 2}) rotate(-90)`).text((d) => d);

      panel.selectAll("path.curve").data([spec.values]).join("path")
        .attr("class", "curve").style("stroke", colour).attr("d", line);

      // Direct label at the top right of the panel, where all three curves are flat at
      // zero (the block ends before the right edge): the name in the text colour, then a
      // short swatch of the curve colour. Anchoring at the right edge keeps the label
      // clear of the curves at any width.
      const label = panel.selectAll("g.direct-label").data([spec]).join((enter) => {
        const g = enter.append("g").attr("class", "direct-label");
        g.append("text").attr("class", "curve-label").attr("text-anchor", "end").attr("x", -24);
        g.append("line").attr("class", "curve").attr("x1", -18).attr("x2", 0).attr("y1", -4).attr("y2", -4);
        return g;
      }).attr("transform", `translate(${MARGIN.left + innerWidth - 8},14)`);
      label.select("line").style("stroke", colour);
      label.select("text").text((d) => d.label);
    });

  d3.select("#readout").text(
    `Maximum of the convolution in the window: ${d3.max(conv).toFixed(2)} a.u. · s.`);
}

/* ---- Slider and layout that follows the container ------------------------ */

// The area of the response does not depend on the slider, so it is written once.
d3.select("#response-area").text(`Area of the response: ${responseArea.toFixed(2)} s.`);

const slider = d3.select("#block-length");
const plotBox = d3.select("#plot").node();

function update() {
  const length = Number(slider.property("value"));
  d3.select("#block-value").text(`${length} s`);
  slider.attr("aria-valuetext", `${length} seconds`);
  render(Math.max(280, Math.floor(plotBox.clientWidth)), length);
}

// The native range input handles the mouse, touch and the arrow, Home, End and
// Page keys; the "input" event fires continuously while it moves.
slider.on("input", update);

// Redraw when the frame or the window changes width.
let lastWidth = 0;
new ResizeObserver(() => {
  const w = Math.floor(plotBox.clientWidth);
  if (w !== lastWidth) {
    lastWidth = w;
    update();
  }
}).observe(plotBox);

update();
</script>
</body>
</html>
