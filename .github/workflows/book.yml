# Build, execute and deploy the book.
#
# The notebooks are executed headless by pytest (tests/test_notebooks.py), which writes
# the executed copies under _build/executed/. scripts/build_book.py then builds the site
# from those copies, without --execute, and checks the pages MyST built. The site is
# deployed to GitHub Pages only for a push to main.
#
# Every action is pinned to the full version that `gh api repos/<owner>/<action>/releases/latest`
# returned on 2026-11-11, and the inputs used below were read in the action.yml of that
# version. astral-sh/setup-uv publishes no moving major tag, so the full version is used
# for every action, for one rule.

name: Book

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per event and ref, and only a push to main deploys. The content of the site is
# the content of main: a manual run and a run for a pull request or another branch build,
# test and measure, and never deploy. A newer push to a branch cancels the run it
# supersedes; on main a run in progress is never cancelled, so a deployment is not cut
# short, and the pushes to main are served in the order they arrive. GitHub keeps one
# running and one pending run per group, so when a third push arrives the pending run is
# replaced by it: that run is cancelled and its timings are lost, but its commit is
# inside the newer one. The event name is part of the group so that a manual run on main
# (the timing runs) does not take the place of a push in the queue. A pull request from a
# branch of this repository still runs twice, once for the push and once for the pull
# request, because the two runs have different events and refs (refs/heads/<branch> and
# refs/pull/<number>/merge); neither deploys. The `pages` group of the deploy job orders the
# deployments of the runs that reach it. A re-run of an older push run on main keeps its
# commit, so the deploy job compares that commit with the head of main before it deploys
# and skips the deployment when they differ; to deploy again by hand, re-run the push run
# of the head. These rules are taken from the documentation of GitHub Actions.
concurrency:
  group: book-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The site is served from a sub-folder of the account's Pages domain, so MyST needs the
  # base URL at build time. MyST reads the environment variable BASE_URL, whose value is
  # the path of the site, here "/<repository name>". Source: "Deploy to GitHub Pages" at
  # https://mystmd.org/guide/deployment-github-pages, which the Jupyter Book 2 page
  # https://jupyterbook.org/stable/build-and-publish/publish links to for the GitHub Pages
  # configuration. scripts/build_book.py does not set it; its child process inherits it.
  # The value comes from the repository name in the event payload, not from the Pages API,
  # so the build job needs no Pages configuration step and no pages permission.
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Print the hardware of the runner
        run: |
          echo "nproc: $(nproc)"
          free -m
          df -h /
          cat /etc/os-release
          echo "ImageOS=${ImageOS:-unset} ImageVersion=${ImageVersion:-unset}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # Node.js 26 is the major version the site was validated with on the Mac
      # (node --version printed v26.12.0, recorded in COMPAT.md). Jupyter Book 2 runs the
      # MyST engine on Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"

      # The FRESH archives are fetched from OSF by scripts/download_data.py. The key changes
      # only when that script does, since the archives, their sizes and their checksums are
      # written in it. The cache is restored here and saved right after the download, by the
      # two sub-actions, because the single actions/cache action saves in its post step,
      # which runs only when the whole job succeeds: a cold run that failed later would
      # leave nothing behind and the next run would download the archives again.
      - name: Restore the FRESH data
        id: fresh-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: data/fresh
          key: fresh-${{ hashFiles('scripts/download_data.py') }}

      # The output is true for an exact hit and empty when nothing was found.
      - name: Report the FRESH cache
        run: echo "FRESH cache hit - ${{ steps.fresh-cache.outputs.cache-hit || 'no exact hit' }}"

      - name: Install the environment
        run: uv sync --locked

      - name: Download the FRESH data
        run: uv run python scripts/download_data.py --data-dir data

      - name: Save the FRESH data
        if: steps.fresh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: data/fresh
          key: fresh-${{ hashFiles('scripts/download_data.py') }}

      - name: Lint
        run: uv run ruff check .

      - name: Check the format
        run: uv run ruff format --check .

      # The committed notebooks must be what the script writes for the ref they carry
      # (the badge, the setup cell and the Colab runtime request), so that a hand edit of
      # the setup cell, or a change of the template, of config/colab.yaml or of the
      # overrides of pyproject.toml that was not written into the notebooks, fails here.
      - name: Check the Colab cells
        run: uv run python scripts/sync_colab_cells.py --check

      # The notebooks are executed once, by the next step, so this step leaves them out.
      - name: Test (no notebook of the book)
        run: uv run python -m pytest --ignore tests/test_notebooks.py

      # A committed file cannot name its own commit, so the committed notebooks carry the
      # ref main. This step points the Colab badge and the setup cell of the checkout at the
      # commit that is built, so that the pages of this run link to the notebooks they
      # were built from. It runs before the notebooks are executed because the executed
      # copies, and the pages built from them, are made from these files.
      - name: Point the Colab links at this commit
        run: uv run python scripts/sync_colab_cells.py --ref "$GITHUB_SHA"

      - name: Execute the notebooks
        id: notebooks
        run: uv run python -m pytest tests/test_notebooks.py -v

      # The timings file is written by a session fixture of the notebook step, a failed
      # notebook included. It does not exist when pytest stops before running any test, for
      # example at collection when the table of contents is refused, so a missing file only
      # warns here: the failure to read is the notebook step's own.
      - name: Upload the notebook timings
        if: ${{ !cancelled() && steps.notebooks.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: notebook-timings
          path: build-reports/notebook-timings.json
          if-no-files-found: warn

      - name: Build the book from the executed notebooks
        run: uv run python scripts/build_book.py

      # The Pages artifact holds the HTML of the staging folder and nothing else: the
      # staging folder holds myst.yml, the pages and the executed notebooks, never data/.
      - name: List what the Pages artifact holds
        run: |
          find _build/executed/_build/html -type f | sort
          du -sh _build/executed/_build/html

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _build/executed/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Pages must be enabled in the repository settings for this job. One deployment at a
    # time; a running deployment is not cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # On the first attempt of a run the step deploys without looking at the head of main:
      # the push runs of main deploy in the order of their group, and if a newer head were
      # skipped or failed, the commit of this run would never be deployed. A re-run of an
      # older run is what puts older content back, so only an attempt other than the first
      # compares its commit with the head of main (GITHUB_RUN_ATTEMPT begins at 1 and
      # increments with each re-run, per the GitHub documentation of variables). A re-run
      # made while pushes are queued takes the pending place of its group. The comparison
      # needs no token and no permission, because a public repository answers git ls-remote
      # without credentials. It fails when the answer is empty or the command fails: the
      # job never deploys on a doubt. When the commit of this run is no longer the head of
      # main, it deploys nothing and the job ends green.
      - name: Check that this commit is the head of main
        id: head
        env:
          REMOTE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" = "1" ]; then
            echo "First attempt of this run: push runs to main deploy in the order of their group."
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head="$(git ls-remote "$REMOTE" refs/heads/main | cut -f1)"
          echo "head of main: ${head:-<empty>}"
          echo "this run:     ${GITHUB_SHA}"
          if [ -z "$head" ]; then
            echo "::error::git ls-remote returned no commit for refs/heads/main; nothing is deployed on a doubt."
            exit 1
          fi
          if [ "$head" = "${GITHUB_SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "This commit is no longer the head of main, so an older site would replace a newer one: nothing is deployed."
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.head.outputs.current == 'true'
        uses: actions/deploy-pages@v5.0.1
